# Aura — Agent 对话提示词与规则意图
#
# 格式：key = value，`#` 起注释。
#   system                         系统提示词（Phase B2 交给 LLM 后端）
#   intent.<name>.keywords         触发词，'|' 分隔；空 = 不作为规则匹配
#   intent.<name>.tool             意图绑定的工具名（tool_runner 在 B2 执行）
#
# 未出现本文件时，dialogue stage 使用代码内置的同名规则。

system = 你是一个端侧语音助手。回答简洁、口语化，一次只问一个问题。

intent.weather.keywords = 天气|weather
intent.weather.tool = get_weather

intent.time.keywords = 时间|几点|time
intent.time.tool = get_time

intent.volume.keywords = 音量|volume
intent.volume.tool = set_volume
