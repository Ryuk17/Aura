# Aura — 全双工示例：采集链 + 播放链（Phase C）
#
# 采集链与播放链同属一个 pipeline，但拓扑独立：
#   mic → bf → aec → ns → agc → tee(vad, kws, sr) → asr
#   tts → src → playback（playback 回采给 aec ref）
#
# `playback` 需要应用通过 aura_agent_set_playback_backend() 注入 HAL；
# 未注入时使用 null 后端（音频丢弃，仅保留流与统计）。
# TTS 模型路径相对 model_dir；Kokoro 默认 24 kHz。

sample_rate = 16000
frame_ms    = 10
channels    = 2
log_level   = info
model_dir   = ../soundproof/models

chain = bf, aec, ns, agc, tee(vad, kws, sr), asr

# 麦阵：线性双麦，间距 2cm
chain_param_bf.mic_spacing_m = 0.02
chain_param_bf.target_azimuth = 1.5708

# AEC 参考由 playback sink 回采提供（不需要上层 feed_ref_audio）
chain_param_aec.delay_ms = -1

chain_param_ns.suppression_level = 1
chain_param_agc.agc_mode = 2

# VAD：silero（需要模型）；调试时可改 vad_mode = 0 用 WebRTC
chain_param_vad.vad_mode = 1
chain_param_vad.threshold = 0.5
chain_param_vad.playback_threshold = 0.65

chain_param_kws.threshold = 0.25
chain_param_sr.threshold = 0.6
chain_param_asr.enable_endpoint = 1
chain_param_asr.decoding_method = 0

# ---------------------------------------------------------------- 播放链
playback_sample_rate = 24000
playback_chain = tts, src, playback

playback_chain_param_src.out_sample_rate = 16000
# 模型目录以 soundproof/models/download.sh 的实际下载路径为准，
# 不同版本可能是 kokoro-v1_0.mnn 或 kokoro-v1_0-MNN。
playback_chain_param_tts.model_type       = kokoro
playback_chain_param_tts.model_path       = tts/kokoro-v1_0.mnn/tts.mnn
playback_chain_param_tts.voices_path      = tts/kokoro-v1_0.mnn/voices.mnn
playback_chain_param_tts.tokens_path      = tts/kokoro-v1_0.mnn/tokenizer.txt
playback_chain_param_tts.output_sample_rate = 24000
playback_chain_param_tts.speed            = 1.0
