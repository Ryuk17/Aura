# Aura — Agent 工具配置
#
# 格式：tool.<name>.<field> = value
#   enabled      1/0，是否允许调用
#   idempotent   1/0，允许重试（以 call_id 为幂等键，重复投递不会重复执行）
#   max_retries  返回 AURA_ERR_AGAIN 时的最大重试次数

tool.get_time.enabled = 1
tool.get_time.idempotent = 1
tool.get_time.max_retries = 0

tool.get_weather.enabled = 1
tool.get_weather.idempotent = 1
tool.get_weather.max_retries = 1

tool.set_volume.enabled = 1
tool.set_volume.idempotent = 1
tool.set_volume.max_retries = 0
