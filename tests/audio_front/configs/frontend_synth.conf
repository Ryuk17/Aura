# Aura Phase 2 语音前端 —— 合成场景配置（无麦克风时的主验证路径）
#
# 链序固定 aec3 → bf → ns → agc → src：回声先消（AEC 需要最原始的参考对齐），
# 再合成波束、压噪声、拉电平，最后降采样成下游要的 8k。
# 顺序不是随便排的：BF 之后通道数收成 1（NIN1），AGC 经典版是单声道实现，
# 所以 AGC 必须在 BF 之后 —— 反过来配会在装配期被 agc 的 in_channels 校验拦下。
chain = aec3, bf, ns, agc, src

# AEC：合成场景的参考是双声道 far（TrickRoom 按 capture 通道数交错读 far 缓冲，
# 参考流的通道数必须与近端一致，否则延迟估计会被带偏且**不报错**）。
# 真机接上后这里不用改，改的是喂进来的 WAV。

# AGC：2 = AdaptiveDigital，与 TrickRoom 自带单测同档。
chain_param_agc.agc_mode = 2

# SRC：16k → 8k 整数比 2:1。声明了 out_sample_rate 就必须真的生效 ——
# 适配层会据此把链的生效采样率推给下游，测试也据此断言末帧采样率。
chain_param_src.out_sample_rate = 8000

sample_rate = 16000
frame_ms    = 10
channels    = 2
log_level   = warn
