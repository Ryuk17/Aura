# Aura Phase 2 语音前端 —— 真实录音配置（assets/audio/microphone_array 的 CH0/CH1）
#
# 链与合成场景完全一致：同一份前端，换个输入源而已。区别只在于**没有参考流**。
#
# 真实录音是"对着麦克风说话时同时放音乐"录的？不是 —— 目前手上的素材只有两路
# 麦克风，没有播放回采，所以 AEC 拿不到参考，走的是"缺参考 → 静音顶替"的降级
# 路径，统计上表现为 ref_missed == frames_in。这条路径验证的是 **不崩、不卡、
# 其余节点照常工作**；AEC 的消回声能力在合成场景（frontend_synth.conf）里验。
# 等板子接上播放回采后，这个文件不需要改，改的是喂进来的 WAV 多一个 --ref。
chain = aec3, bf, ns, agc, src

# AGC：2 = AdaptiveDigital。
chain_param_agc.agc_mode = 2

# SRC：16k → 8k。真实录音也是 16k，同样降一半。
chain_param_src.out_sample_rate = 8000

sample_rate = 16000
frame_ms    = 10
channels    = 2
log_level   = warn
