# Aura 算法链配置示例（Phase 2 起的装配方式）
#
# 用法：
#   host_sim --use-silero --config tests/host_sim/configs/silero.conf
#
# 说明：--use-silero 负责"把 silero_vad 这个算法描述表注册进算法表"，
# 本文件负责"让 agent 按链把节点建出来"。两者分开是因为前者是代码
# （编译期就存在的算法），后者是配置（换板子/换组合只改这里）。

# 链语法：逗号分隔的算法注册名；tee(...) 把观察者挂到前一个主链节点的旁路
# （观察者只消费音频、不产出音频，主线继续往下走）。
# Phase 2 接上 TrickRoom 后的真实前端形如：
#   chain = aec3, ns, tee(silero_vad, kws), asr
chain = silero_vad

# 单算法参数：chain_param_<注册名>.<键> = 值
# 键必须在该算法的 param_specs 里声明过 —— 拼错的键在 init 期直接报
# NOT_FOUND，而不是静默失效（见 docs/algorithm_unified_api.md）。
chain_param_silero_vad.threshold = 0.5

# 其余键与 agent 配置同名。model_dir 不在这里写：host_sim 会指向源码树的
# models/（权重不入库，见 models/download.sh）。
sample_rate = 16000
frame_ms    = 10
channels    = 1
log_level   = info
